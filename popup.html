<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>LeetCoach</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <div class="container">

        <h1>🧠 LeetCoach</h1>

        <div class="card">

            <h2 id="problem">Loading...</h2>

            <span id="difficulty" class="difficulty">
                Loading...
            </span>

            <hr>

            <h3>Description</h3>

            <p id="description">
                Loading...
            </p>

            <button id="hintBtn">
                💡 Get First Hint
            </button>

            <div id="hintBox" class="hint-box" style="display: none;">
                <h3>💡 Hint</h3>
                <p id="hintText"></p>
            </div>

        </div>

    </div>

    <script src="popup.js"></script>
<script src="api.js"></script>
<script src="popup.js"></script>
</body>

</html>
